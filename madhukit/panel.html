<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madhu</title>
<style>
  :root { color-scheme: dark; --bg:#1e1e1e; --card:#252526; --card2:#2d2d30; --line:#3c3c3c; --ink:#e8e8e8; --dim:#a8a8a8;
    --honey:#ffbe00; --honey-soft:#3d330f; --on-honey:#0b0b0a; --good:#6ee7a0; --good-soft:#1f3a2b; --bad:#f2998f; --bad-soft:#3a2321; --code:#161616; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg:#fbf7ec; --card:#ffffff; --card2:#f6f1e3; --line:#e3d9bd; --ink:#1d1a12; --dim:#5c5545;
      --honey:#ffbe00; --honey-soft:#fff3c4; --on-honey:#0b0b0a; --good:#146a3e; --good-soft:#e3f2ea; --bad:#a8281d; --bad-soft:#fbeae8; --code:#f3eee0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 "Segoe UI", system-ui, sans-serif; }
  main { padding: 12px 14px 20px; display: grid; gap: 12px; max-width: 46rem; }
  .top { display: flex; align-items: center; gap: 10px; }
  .av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--honey); flex: none; background: var(--honey-soft); }
  .who { font-weight: 800; font-size: 15px; line-height: 1.1; } .mis { color: var(--dim); font-size: 12px; }
  .stepno { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--dim); white-space: nowrap; }
  .dots { display: flex; gap: 3px; } .dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .dots i.d { background: var(--good); } .dots i.c { background: var(--honey); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
  .kind { justify-self: start; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--on-honey); background: var(--honey); border-radius: 999px; padding: 2px 9px; }
  h1 { font-size: 18px; margin: 0; line-height: 1.25; }
  .body { color: var(--ink); } .body b { color: var(--ink); }
  .dim { color: var(--dim); } .small { font-size: 12.5px; }
  code { font-family: Consolas, "DM Mono", monospace; background: var(--code); border-radius: 4px; padding: 1px 5px; color: var(--ink); }
  .cmds { display: grid; gap: 5px; }
  .cmdrow { display: flex; gap: 6px; align-items: stretch; }
  .cmd { flex: 1; display: block; font-family: Consolas, "DM Mono", monospace; background: var(--code); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; word-break: break-all; }
  button { font: inherit; background: var(--card2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--honey); }
  button.p { background: var(--honey); color: var(--on-honey); border-color: var(--honey); font-weight: 700; }
  button.copy { font-size: 12px; padding: 2px 10px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .opts { display: grid; gap: 6px; } .opts button { text-align: left; padding: 9px 12px; }
  input { flex: 1; min-width: 8rem; font: inherit; background: var(--code); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  pre { margin: 0; white-space: pre-wrap; font: 13px Consolas, monospace; background: var(--code); border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; }
  .msg { padding: 8px 11px; border-radius: 8px; background: var(--card2); }
  .msg.good { background: var(--good-soft); color: var(--good); } .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .flash { padding: 7px 11px; border-radius: 8px; background: var(--good-soft); color: var(--good); font-size: 13px; }
  .hint { padding: 8px 11px; border-radius: 8px; background: var(--honey-soft); }
  .brief { display: grid; gap: 8px; } .brief .ask { font-size: 15px; font-weight: 700; }
  .brief .io { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); }
  .brief .io b { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
  .brief ol { margin: 0; padding-left: 20px; } .brief li { margin: 2px 0; }
  .score { display: flex; align-items: baseline; gap: 8px; } .score b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--good); }
  .cust { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .say { justify-self: start; max-width: 92%; background: var(--card2); border-radius: 10px 10px 10px 3px; padding: 5px 10px; }
  .said { justify-self: end; max-width: 92%; background: var(--bad-soft); color: var(--bad); border-radius: 10px 10px 3px 10px; padding: 5px 10px; }
  .eb { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .err { border-color: var(--bad); }
  .done-card { border-color: var(--good); }
  footer { color: var(--dim); font-size: 12px; text-align: center; }
  .try table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .try th { text-align: left; font-size: 11px; color: var(--dim); font-weight: 700; padding: 4px 6px; }
  .try { overflow-x: auto; } .try td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  .try tr.ok td:last-child { color: var(--good); } .try tr.no td:last-child { color: var(--bad); }
  .try tr.no td:nth-child(2) code { color: var(--bad); }
  .stuck { border-color: var(--honey); }
  a.btn { display: inline-block; text-decoration: none; background: var(--honey); color: var(--on-honey); border-radius: 8px; padding: 7px 12px; font-weight: 700; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="dim">Madhu is starting...</p></main>
<script>
(function () {
  var key = new URLSearchParams(location.search).get("k") || "";
  var app = document.getElementById("app"), last = "", reply = "";
  var KIND = { say: "Read", hunt: "Find it", predict: "Predict", write: "Write code", "break": "Break it on purpose", git: "Git",
               talk: "Meet the customers", setup: "Install", friend: "Friend test", connect: "Connect", deploy: "Put it online", key: "Keep your key safe" };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function post(action, data) {
    return fetch("/" + action + "?k=" + encodeURIComponent(key), { method: "POST", headers: { "Content-Type": "application/json", "X-Madhu": "1" }, body: JSON.stringify(data || {}) })
      .then(function (r) { return r.json(); });
  }
  // One command per line, each with its own Copy button: two commands on one line read as one command.
  function cmds(text) {
    return '<div class="cmds">' + String(text).split("\n").filter(function (c) { return c.trim(); }).map(function (c) {
      return '<div class="cmdrow"><code class="cmd">' + esc(c) + '</code><button class="copy" data-copy="' + esc(c) + '" title="Copy this command">Copy</button></div>';
    }).join("") + "</div>";
  }
  function top(v) {
    var h = '<div class="top"><img class="av" src="/bee.jpg?k=' + encodeURIComponent(key) + '" alt=""><div><div class="who">Madhu</div><div class="mis">' + esc(v.mission || "Your helper in VS Code") + "</div></div>";
    if (v.mode === "pack") h += '<div class="stepno">Step ' + v.index + " of " + v.total + "</div>";
    if (v.mode === "finished") h += '<div class="stepno">All done</div>';
    h += "</div>";
    if (v.outline && v.outline.length) {
      h += '<div class="dots" aria-hidden="true">' + v.outline.map(function (s, i) {
        var c = v.mode === "finished" || i < v.index - 1 ? "d" : i === v.index - 1 ? "c" : "";
        return '<i class="' + c + '" title="' + esc(s.t) + '"></i>';
      }).join("") + "</div>";
    }
    return h;
  }
  function errorBox(e) {
    var where = e.file ? esc(e.file) + ", line " + esc(e.line) : "";
    return '<div class="card err"><div class="eb">' + esc(e.title) + "</div><div>" + esc(e.plain) + "</div>" +
      (e.detail ? '<div class="dim small">' + esc(e.detail) + "</div>" : "") +
      (where ? '<div class="row"><button data-there="' + esc(e.file) + '" data-line="' + esc(e.line) + '">Take me to ' + where + "</button></div>" : "") + "</div>";
  }
  function line(v) {
    var l = v.line; if (!l) return "";
    var pct = l.total ? Math.round(l.happy / l.total * 100) : 0;
    var rows = l.unhappy.slice(0, 3).map(function (c) {
      return '<div class="cust"><div class="say"><b>' + esc(c.name) + ":</b> " + esc(c.ask) + '</div><div class="dim small">Wanted: ' + esc(c.wanted) +
        '</div><div class="said">Your bot: ' + esc(c.said) + "</div></div>";
    }).join("");
    var more = l.unhappy.length > 3 ? '<div class="dim small">' + (l.unhappy.length - 3) + " more still waiting</div>" : "";
    return (l.error ? errorBox(l.error) : "") + '<div class="card"><div class="eb">Happy customers</div><div class="score"><b>' + l.happy + " of " + l.total +
      '</b><span class="dim">' + (l.happy === l.total ? "everyone is happy" : "are happy") + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' + rows + more + "</div>";
  }
  function action(s) {
    var h = "";
    if (s.kind === "predict") {
      if (!s.answered) h += '<div class="opts">' + s.options.map(function (o) { return '<button data-answer="' + esc(o) + '">' + esc(o) + "</button>"; }).join("") + "</div>";
      else { if (s.reveal) h += '<div class="eb">What Python really did</div><pre>' + esc(s.reveal) + "</pre>"; h += '<div class="row"><button class="p" data-do="continue">Continue</button></div>'; }
    }
    if (s.kind === "say") h += '<div class="row"><button class="p" data-do="continue">Continue</button></div>';
    if (s.kind === "talk") h += '<div class="row"><button class="p" data-do="continue">Let the customers in</button></div>';
    if (s.kind === "hunt") h += '<form data-form="hunt" class="row"><input id="huntin" aria-label="Your answer" placeholder="' + esc(s.prompt || "Type your answer") + '" autocomplete="off"><button class="p">Check</button></form>';
    if (s.kind === "setup" || s.kind === "connect" || s.kind === "key") h += '<div class="dim small">Madhu is watching. This step finishes by itself.</div>';
    if (s.kind === "deploy") h += '<form data-form="hunt" class="row"><input id="huntin" type="url" aria-label="Your app\'s web address" placeholder="https://your-app.onrender.com" autocomplete="off"><button class="p">Check my app</button></form>' +
      '<div class="dim small">A sleeping app takes about a minute to wake up. Madhu waits for it.</div>';
    if (s.kind === "git") h += '<div class="dim small">Type the commands in your second terminal. Madhu sees the result and moves on by itself.</div>';
    if (s.kind === "friend") {
      h += s.chat.map(function (c) { return '<div class="cust"><div class="say"><b>Friend:</b> ' + esc(c.q) + '</div><div class="said">Your bot: ' + esc(c.a) + "</div></div>"; }).join("");
      h += '<form data-form="hunt" class="row"><input id="huntin" aria-label="A question from your friend" placeholder="Question ' + (s.chat.length + 1) + " of " + (s.count || 3) + '" autocomplete="off"><button class="p">Ask the bot</button></form>';
    }
    if (s.kind === "write" || s.kind === "break") {
      h += '<div class="dim small">Change the code, then press <b>Ctrl+S</b>. Madhu checks every save.</div>';
      h += s.hints.map(function (x, i) { return '<div class="hint"><b>Hint ' + (i + 1) + ":</b> " + esc(x) + "</div>"; }).join("");
      h += '<div class="row">' + (s.kind === "write" ? '<button data-do="hint"' + (s.hints_left ? "" : " disabled") + ">" + (s.hints_left ? "Give me a hint" : "No more hints") + "</button>" : "") +
        '<button data-do="restore">Go back to my last working version</button></div>';
    }
    return h;
  }
  // The Try it table: example inputs, what the student's code gives now, and what it should give. Updated on every save.
  function tryTable(s) {
    if (!s.examples || !s.examples.length) return "";
    var rows = s.examples.map(function (r) {
      return '<tr class="' + (r.ok ? "ok" : "no") + '"><td><code>' + esc(r.input) + "</code></td><td><code>" + esc(r.got) + "</code></td><td><code>" +
        esc(r.want) + "</code></td><td>" + (r.ok ? "&#10003;" : "&#10007;") + "</td></tr>";
    }).join("");
    return '<div class="try"><div class="eb">Try it: what your code gives now</div><table><thead><tr><th>Input</th><th>Your code gives</th>' +
      "<th>It should give</th><th></th></tr></thead><tbody>" + rows + '</tbody></table><div class="dim small">This updates every time you save.</div></div>';
  }
  // After the last hint and a few more tries: the answer with why, or a person. Never a dead end.
  function stuckCard(v) {
    var s = v.step;
    if (s.answer) {
      return '<section class="card stuck"><div class="eb">The answer</div><pre>' + esc(s.answer.code) + "</pre>" +
        '<div><b>Why it works.</b> ' + esc(s.answer.why) + "</div>" +
        '<div class="dim small">Type it into your file yourself, then press Ctrl+S. Typing it helps you remember it.</div></section>';
    }
    if (!s.stuck) return "";
    var link = v.portal ? v.portal + "/ticket/" + encodeURIComponent(v.code) + "?step=madhu&stuck=1" : "";   // Launchpad or Project: the portal knows where
    return '<section class="card stuck"><div class="eb">Still stuck?</div><div>That happens to everyone. You have three ways forward:</div>' +
      "<div>1. Ask Madhu below. Say what you tried and what happened.</div>" +
      (s.can_show ? "<div>2. See the answer, with why it works. You still type it in yourself. Your mentor sees that you used it.</div>" : "") +
      "<div>" + (s.can_show ? "3" : "2") + ". Ask your mentor. They see this step and your customers, and reply in the portal.</div>" +
      '<div class="row">' + (s.can_show ? '<button class="p" data-do="show">Show me the answer</button>' : "") +
      (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Ask my mentor</a>' : "") + "</div></section>";
  }
  // A code step's ask in one fixed shape (owner, 20 Nov): the task, what it gets and gives back, how to approach it,
  // where, and when it is done. Pack text is ours, written as HTML, like the body.
  function brief(s) {
    if (!s.ask) return "";
    var h = '<div class="brief"><div class="ask">Your task: ' + s.ask + "</div>";
    if (s.gets || s.gives) h += '<div class="io">' + (s.gets ? "<b>It gets</b><span>" + s.gets + "</span>" : "") + (s.gives ? "<b>It gives back</b><span>" + s.gives + "</span>" : "") + "</div>";
    if (s.approach && s.approach.length) h += "<div><b>How to approach it</b><ol>" + s.approach.map(function (a) { return "<li>" + a + "</li>"; }).join("") + "</ol></div>";
    if (s.where) h += "<div><b>Where.</b> " + s.where + "</div>";
    if (s.done) h += "<div><b>Done when</b> " + s.done + "</div>";
    return h + "</div>";
  }
  function stepCard(v) {
    var s = v.step, h = '<section class="card"><span class="kind">' + esc(KIND[s.kind] || "Step") + "</span><h1>" + esc(s.title) + "</h1>";
    if (s.body) h += '<div class="body">' + s.body + "</div>";
    h += brief(s);
    if (s.cmd) h += cmds(s.cmd);
    if (s.file) h += '<div class="row"><button data-there="' + esc(s.file) + '" data-line="' + esc(s.at || 1) + '">Take me there</button></div>';
    h += tryTable(s);
    h += action(s);
    if (v.msg && !v.flash) h += '<div class="msg ' + esc(v.tone) + '">' + esc(v.msg) + "</div>";
    if (v.rescue) h += '<div class="msg bad">' + esc(v.rescue) + "</div>";
    return h + "</section>";
  }
  function madhu() {
    return '<section class="card"><div class="eb">Ask Madhu</div>' + (reply ? '<div class="hint">' + esc(reply) + "</div>" : "") +
      '<form data-form="ask" class="row"><input id="askin" aria-label="Ask Madhu" placeholder="Ask about this step" autocomplete="off"><button>Ask</button></form></section>';
  }
  function mentorBox(v) {
    if (!v.mentor || !v.mentor.length) return "";
    return '<section class="card"><div class="eb">From your mentor</div>' + v.mentor.map(function (c) {
      var at = c.path ? esc(c.path) + (c.line ? ", line " + esc(c.line) : "") : "";
      return '<div class="hint"><b>' + esc(c.author) + (at ? " on " + at : "") + ":</b> " + esc(c.body) + "</div>" +
        (c.path ? '<div class="row"><button data-there="' + esc(c.path) + '" data-line="' + esc(c.line || 1) + '">Take me there</button></div>' : "");
    }).join("") + '<div class="dim small">Fix this, then commit and push.</div></section>';
  }
  function paint(v) {
    var typing = document.activeElement && document.activeElement.tagName === "INPUT";
    var sig = JSON.stringify(v) + reply;
    if (sig === last || typing) return;
    last = sig;
    var h = top(v);
    if (v.welcome) h += '<div class="msg">' + esc(v.welcome) + "</div>";
    h += mentorBox(v);
    if (v.mode === "arrive") {
      h += '<section class="card"><h1>' + esc(v.title) + "</h1><div>" + esc(v.body) + "</div>" + (v.cmd ? cmds(v.cmd) : "") + "</section>";
    } else if (v.mode === "finished") {
      h += '<section class="card done-card"><span class="kind">Done</span><h1>Every step is done</h1><div>' + esc(v.next) + "</div></section>";
      if (v.next_cmd) h += '<section class="card"><div class="eb">Your next mission is ready</div><div>Move to it by typing this in your second terminal. Madhu follows you there.</div>' + cmds(v.next_cmd) + "</section>";
      h += line(v);
    } else {
      if (v.flash) h += '<div class="flash">&#10003; Finished: ' + esc(v.flash) + ". " + esc(v.msg) + "</div>";
      h += stepCard(v) + stuckCard(v) + line(v) + madhu();
    }
    h += '<footer>Madhu checks your code every time you save. Your work stays on your laptop until you push.</footer>';
    app.innerHTML = h;
  }
  function tick() { fetch("/state?k=" + encodeURIComponent(key)).then(function (r) { return r.json(); }).then(paint).catch(function () {}); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.copy !== undefined) {
      var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, function () {}); return;
    }
    if (b.dataset.answer !== undefined) post("answer", { value: b.dataset.answer }).then(paint);
    else if (b.dataset.do) post(b.dataset.do).then(paint);
    else if (b.dataset.there) post("there", { file: b.dataset.there, line: +b.dataset.line }).then(function (v) { if (!v.opened) { v.msg = "Open " + b.dataset.there + " and go to line " + b.dataset.line + "."; } paint(v); });
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, i = f.querySelector("input"), val = i.value.trim(); if (!val) return;
    i.value = ""; i.blur();
    if (f.dataset.form === "hunt") post("answer", { value: val }).then(paint);
    else post("ask", { question: val }).then(function (v) { reply = v.reply || ""; paint(v); });
  });
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
